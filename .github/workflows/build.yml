name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
  # Flet'in Android build alabilmesi için doğrudan Ubuntu işletim sisteminde tam yetkili ortam kuruyoruz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up Java (Gradle için şart)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet pandas websockets
          
      - name: Build Android APK
        run: |
          # Projeyi flutter ile doğrudan Android APK modunda derlemeye zorluyoruz
          flet build apk --project-path . --yes
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-apk
          path: |
            build/apk/*.apk
            build/**/output-metadata.json
